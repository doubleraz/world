name: Fetch THE Playlist

on:
  schedule:
    # Runs every 6 hours in UTC (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    # Lets you trigger a test run manually from the Actions tab anytime

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run playlist fetcher
        run: python fetch_playlist.py

      - name: Upload playlist artifact
        uses: actions/upload-artifact@v7
        with:
          name: THE-playlist
          path: playlist.m3u
          retention-days: 7
